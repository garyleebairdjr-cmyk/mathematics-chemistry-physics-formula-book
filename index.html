<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mathematics, Chemistry &amp; Physics Formula Book</title>
    <meta
      name="description"
      content="A free field book of mathematics from arithmetic to the frontier, with the formulas of physics, chemistry, and biology, worked examples, and interactive calculators."
    />
    <meta name="theme-color" content="#07080d" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Mathematics, Chemistry & Physics Formula Book" />
    <meta
      property="og:description"
      content="Mathematics from arithmetic to the frontier, plus the formulas of physics, chemistry, and biology — with worked examples and calculators."
    />
    <meta
      property="og:image"
      content="https://garyleebairdjr-cmyk.github.io/mathematics-chemistry-physics-formula-book/og.jpg"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=Space+Grotesk:wght@500;600;700&display=swap"
    />
    <script>
      // Apply the saved (or system) theme and accent before first paint, so there is no flash.
      (function () {
        var pref = "system";
        var ink = "amber";
        try {
          var raw = localStorage.getItem("formula-book-appearance");
          var saved = raw ? (JSON.parse(raw) || {}).state || {} : null;
          if (saved) {
            if (saved.theme === "light" || saved.theme === "dark" || saved.theme === "system") pref = saved.theme;
            if (["amber", "sky", "sage", "violet"].indexOf(saved.ink) >= 0) ink = saved.ink;
          } else {
            var old = localStorage.getItem("formula-book-theme");
            if (old === "light" || old === "dark") pref = old;
          }
        } catch (e) {}
        var dark = pref === "system" ? matchMedia("(prefers-color-scheme: dark)").matches : pref === "dark";
        var root = document.documentElement;
        root.setAttribute("data-theme", dark ? "dark" : "light");
        root.setAttribute("data-ink", ink);
        root.style.colorScheme = dark ? "dark" : "light";
        if (dark) root.classList.add("dark");
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute("content", dark ? "#07080d" : "#f4f5f9");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
