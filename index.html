<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mathematics, Chemistry &amp; Physics Formula Book</title>
    <meta
      name="description"
      content="A free field book of mathematics from arithmetic to the frontier, with the formulas of physics, chemistry, and biology, worked examples, and interactive calculators."
    />
    <meta name="theme-color" content="#f4efe6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#16130f" media="(prefers-color-scheme: dark)" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Mathematics, Chemistry & Physics Formula Book" />
    <meta
      property="og:description"
      content="Mathematics from arithmetic to the frontier, plus the formulas of physics, chemistry, and biology — with worked examples and calculators."
    />
    <meta
      property="og:image"
      content="https://garyleebairdjr-cmyk.github.io/mathematics-chemistry-physics-formula-book/og.jpg"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,420;0,7..72,650;1,7..72,420&family=Outfit:wght@420;520;640&display=swap"
    />
    <script>
      // Apply the saved or system color theme before first paint (no flash).
      try {
        var t = localStorage.getItem("formula-book-theme");
        if (t === "dark" || (!t && matchMedia("(prefers-color-scheme: dark)").matches)) {
          document.documentElement.classList.add("dark");
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
